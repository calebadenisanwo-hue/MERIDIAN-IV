name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Generate App Icons
        run: node scripts/generate-icons.mjs

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          validate-wrappers: false

      - name: Build Android Debug APK
        run: |
          chmod +x ./gradlew || true
          mkdir -p ~/.gradle
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.nonTransitiveRClass=true" >> ~/.gradle/gradle.properties
          gradle :app:assembleDebug -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true --no-daemon --stacktrace

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-apk/Meridian-v1.0.0-b${{ github.run_number }}.apk
            cp "$APK_PATH" release-apk/Meridian-latest.apk
            echo "Successfully prepared APK: $APK_PATH"
          else
            echo "Error: No APK file found in app/build/outputs/apk/debug"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-android-app
          path: release-apk/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: Meridian App Release (Build #${{ github.run_number }})
          body: |
            ### 📱 Meridian Android Application
            - **Build Number**: #${{ github.run_number }}
            - **Commit**: `${{ github.sha }}`
            
            #### 📥 Download APK:
            Download **`Meridian-latest.apk`** below to install directly on your Android device.
          draft: false
          prerelease: false
          files: release-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
